# Stack SunuVet uniquement — ne touche pas iziportfolio / takema.
services:
  sunuvet-front-pro:
    image: nginx:1.27-alpine
    container_name: sunuvet_front_pro
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./static:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
