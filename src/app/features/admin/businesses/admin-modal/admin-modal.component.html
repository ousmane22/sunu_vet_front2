<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm" (click)="cancel()"></div>
    <div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">

        <div class="bg-gradient-to-r from-primary-600 to-primary-800 px-8 py-5 flex items-center justify-between">
            <div>
                <h2 class="text-lg font-bold text-white">{{ isEditMode ? 'Modifier l\'administrateur' : 'Ajouter un
                    Administrateur' }}</h2>
                <p class="text-primary-200 text-sm">{{ isEditMode ? 'Mettez à jour les informations' : 'Créer un compte
                    admin pour cette entreprise' }}</p>
            </div>
            <button (click)="cancel()" class="text-white/70 hover:text-white p-1 rounded-lg transition-colors">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-8 space-y-5">

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nom complet <span
                        class="text-red-500">*</span></label>
                <input formControlName="name" type="text" placeholder="Ex: Mamadou Diallo"
                    class="w-full px-4 py-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition"
                    [class.border-red-400]="f.name.invalid && f.name.touched"
                    [class.border-gray-300]="!(f.name.invalid && f.name.touched)">
                <p *ngIf="f.name.invalid && f.name.touched" class="mt-1 text-xs text-red-500">Nom requis (min. 2
                    caractères).</p>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email <span
                        class="text-red-500">*</span></label>
                <input formControlName="email" type="email" placeholder="admin@entreprise.sn"
                    class="w-full px-4 py-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition"
                    [class.border-red-400]="f.email.invalid && f.email.touched"
                    [class.border-gray-300]="!(f.email.invalid && f.email.touched)">
                <p *ngIf="f.email.invalid && f.email.touched" class="mt-1 text-xs text-red-500">Email valide requis.</p>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Mot de passe <span
                        class="text-red-500">*</span></label>
                <input formControlName="password" type="password" placeholder="Min. 8 caractères"
                    class="w-full px-4 py-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition"
                    [class.border-red-400]="f.password.invalid && f.password.touched"
                    [class.border-gray-300]="!(f.password.invalid && f.password.touched)">
                <p *ngIf="f.password.invalid && f.password.touched" class="mt-1 text-xs text-red-500">Minimum 8
                    caractères requis.</p>
            </div>

            <div *ngIf="serverError" class="p-4 bg-red-50 border border-red-200 rounded-xl text-sm text-red-700">{{
                serverError }}</div>

            <div class="flex justify-between pt-2">
                <button type="button" (click)="cancel()"
                    class="border border-gray-300 text-gray-600 px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-gray-50 transition">Annuler</button>
                <button type="submit" [disabled]="isSubmitting"
                    class="bg-primary-600 hover:bg-primary-700 disabled:opacity-60 text-white px-6 py-2.5 rounded-xl text-sm font-semibold shadow-sm transition flex items-center space-x-2">
                    <svg *ngIf="isSubmitting" class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z">
                        </path>
                    </svg>
                    <span>{{ isSubmitting ? 'Création...' : 'Ajouter l\'administrateur' }}</span>
                </button>
            </div>
        </form>
    </div>
</div>
