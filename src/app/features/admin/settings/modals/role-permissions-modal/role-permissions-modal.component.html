<div class="fixed inset-0 z-50 overflow-y-auto" (click)="close()">
  <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
    <!-- Backdrop -->
    <div class="fixed inset-0 transition-opacity bg-gray-900 bg-opacity-75"></div>

    <!-- Modal -->
    <div
      (click)="$event.stopPropagation()"
      class="relative inline-block w-full max-w-2xl px-4 pt-5 pb-4 overflow-hidden text-left align-bottom transition-all transform bg-white rounded-2xl shadow-2xl sm:my-8 sm:align-middle sm:p-6">
      
      <!-- Header -->
      <div class="flex items-start justify-between mb-6">
        <div>
          <h3 class="text-xl font-bold text-gray-900">
            Gérer les permissions
          </h3>
          <p class="mt-1 text-sm text-gray-500">
            Rôle : <span class="font-semibold text-gray-700">{{ role().name }}</span>
          </p>
        </div>
        <button
          type="button"
          (click)="close()"
          class="text-gray-400 hover:text-gray-600 transition-colors">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Info -->
      <div class="mb-4 p-3 bg-blue-50 border border-blue-100 rounded-lg">
        <div class="flex items-center gap-2 text-sm text-blue-800">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>{{ selectedPermissionNames().length }} permission(s) sélectionnée(s)</span>
        </div>
      </div>

      <!-- Liste des permissions -->
      <div class="mb-6 max-h-96 overflow-y-auto border border-gray-200 rounded-xl divide-y divide-gray-100">
        @for (perm of allPermissions(); track perm.id) {
          <label
            [class.bg-primary-50]="isSelected(perm.name)"
            class="flex items-center gap-4 px-4 py-3.5 hover:bg-gray-50 cursor-pointer transition-colors group">
            <input
              type="checkbox"
              [checked]="isSelected(perm.name)"
              (change)="togglePermission(perm.name)"
              class="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500 focus:ring-2 cursor-pointer" />
            <div class="flex-1">
              <p class="text-sm font-medium text-gray-900 font-mono">{{ perm.name }}</p>
            </div>
            @if (isSelected(perm.name)) {
              <svg class="w-5 h-5 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
              </svg>
            }
          </label>
        }
        @if (allPermissions().length === 0) {
          <div class="px-4 py-8 text-center text-sm text-gray-400">
            Aucune permission disponible
          </div>
        }
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
        <button
          type="button"
          (click)="close()"
          [disabled]="isSaving()"
          class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors disabled:opacity-50">
          Annuler
        </button>
        <button
          type="button"
          (click)="save()"
          [disabled]="isSaving()"
          class="px-5 py-2.5 text-sm font-medium text-white bg-primary-600 rounded-xl hover:bg-primary-700 transition-colors disabled:opacity-50 flex items-center gap-2">
          @if (isSaving()) {
            <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span>Enregistrement...</span>
          } @else {
            <span>Enregistrer</span>
          }
        </button>
      </div>
    </div>
  </div>
</div>
