<div class="px-8 py-6">
    <div class="mb-6">
        <div class="flex items-center gap-3 mb-3">
            <div class="h-12 w-12 rounded-2xl bg-gradient-to-br from-purple-500 to-purple-700 flex items-center justify-center shadow-lg">
                <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold text-gray-900">Paramètres</h1>
                <p class="text-sm text-gray-500">Configuration globale de la plateforme</p>
            </div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="mb-6 border-b border-gray-200">
        <nav class="-mb-px flex space-x-4">
            @for (tab of tabs; track tab.id) {
                <button (click)="activeTab.set(tab.id)"
                    [class]="activeTab() === tab.id
                        ? 'border-b-2 border-primary-600 text-primary-700'
                        : 'border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
                    class="flex items-center gap-2 px-4 py-3 text-sm font-semibold transition-all">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="tab.icon" />
                    </svg>
                    {{ tab.label }}
                </button>
            }
        </nav>
    </div>

    <!-- Tab Content -->
    @switch (activeTab()) {
        @case ('plans') {
            <app-settings-plans />
        }
        @case ('roles') {
            <app-settings-roles />
        }
        @case ('general') {
            <div class="bg-white rounded-2xl shadow-sm border p-6">
                <p class="text-gray-500">Paramètres généraux (à implémenter)</p>
            </div>
        }
    }
</div>
