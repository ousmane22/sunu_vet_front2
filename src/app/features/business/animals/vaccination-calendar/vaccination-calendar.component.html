<div class="p-4 md:p-8 max-w-[1400px] mx-auto space-y-6">
  <div>
    <h1 class="text-3xl md:text-4xl font-bold text-black tracking-tight">Calendrier vaccinations</h1>
    <p class="text-gray-700 mt-1 font-medium">Rappels de vaccination à venir, tous animaux confondus.</p>
  </div>

  @if (isLoading()) {
  <div class="py-24 text-center text-sm font-semibold text-gray-500">Chargement…</div>
  } @else {
  <app-event-calendar [events]="calendarEvents()" (rangeChange)="onRangeChange($event)" (eventClick)="goToAnimal($event)">
    <ng-template #eventTemplate let-event>
      <button type="button"
        class="w-full text-left px-1.5 py-1 rounded text-[10px] font-bold truncate transition-colors"
        [class.bg-red-100]="vaccinationFor(event)?.is_overdue" [class.text-red-800]="vaccinationFor(event)?.is_overdue" [class.hover:bg-red-200]="vaccinationFor(event)?.is_overdue"
        [class.bg-amber-100]="!vaccinationFor(event)?.is_overdue && vaccinationFor(event)?.is_due_soon" [class.text-amber-800]="!vaccinationFor(event)?.is_overdue && vaccinationFor(event)?.is_due_soon" [class.hover:bg-amber-200]="!vaccinationFor(event)?.is_overdue && vaccinationFor(event)?.is_due_soon"
        [class.bg-emerald-100]="!vaccinationFor(event)?.is_overdue && !vaccinationFor(event)?.is_due_soon" [class.text-emerald-800]="!vaccinationFor(event)?.is_overdue && !vaccinationFor(event)?.is_due_soon" [class.hover:bg-emerald-200]="!vaccinationFor(event)?.is_overdue && !vaccinationFor(event)?.is_due_soon">
        {{ event.title }}
      </button>
    </ng-template>
  </app-event-calendar>

  <div class="flex items-center gap-4 text-xs font-semibold text-gray-600">
    <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-red-400"></span> En retard</span>
    <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span> Bientôt (30 jours)</span>
    <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span> À venir</span>
  </div>
  }
</div>
