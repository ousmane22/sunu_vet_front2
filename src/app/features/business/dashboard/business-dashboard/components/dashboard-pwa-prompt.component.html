@if (visible()) {
<div
  class="fixed z-40 pointer-events-none
    bottom-[5.25rem] left-3 right-3 max-w-none
    sm:bottom-6 sm:left-4 sm:right-24 sm:max-w-lg
    md:left-1/2 md:-translate-x-1/2 md:right-auto md:w-[min(34rem,calc(100vw-3rem))]">
  <div class="pointer-events-auto pwa-float pwa-glow rounded-2xl border border-primary-200/80 bg-white shadow-lg overflow-hidden relative">
    <button type="button" (click)="dismiss()" aria-label="Masquer"
      class="absolute top-2.5 right-2.5 z-10 w-8 h-8 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors flex items-center justify-center">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <div class="p-4 pr-11 sm:pr-4">
      <div class="flex items-start gap-3 sm:items-center">
        <span class="relative shrink-0 w-10 h-10 rounded-xl bg-primary-700 text-white flex items-center justify-center shadow-md">
          <span class="absolute inset-0 rounded-xl bg-primary-400/30 animate-ping opacity-50"></span>
          <svg class="relative w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
          </svg>
        </span>

        <div class="min-w-0 flex-1">
          <p class="text-sm font-bold text-gray-900 leading-snug">Installer SunuVet directement sur votre appareil</p>
        </div>

        <button type="button" (click)="addToHomeScreen()" [disabled]="installing()"
          class="hidden sm:inline-flex shrink-0 items-center justify-center gap-1.5 px-3.5 py-2.5 rounded-xl text-sm font-bold text-white bg-primary-700 hover:bg-primary-800 active:scale-[0.98] disabled:opacity-70 transition-all shadow-sm whitespace-nowrap">
          @if (installing()) {
          <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
          </svg>
          } @else {
          Installer SunuVet
          }
        </button>
      </div>

      <button type="button" (click)="addToHomeScreen()" [disabled]="installing()"
        class="sm:hidden mt-3 w-full inline-flex items-center justify-center gap-2 px-4 py-3 rounded-xl text-sm font-bold text-white bg-primary-700 hover:bg-primary-800 active:scale-[0.98] disabled:opacity-70 transition-all shadow-sm">
        @if (installing()) {
        <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
        </svg>
        Installation…
        } @else {
        Installer SunuVet
        }
      </button>
    </div>

    @if (hint()) {
    <p class="px-4 pb-4 text-xs text-amber-900 bg-amber-50 border-t border-amber-100 leading-relaxed">
      {{ hint() }}
    </p>
    }
  </div>
</div>
}
