<div
  class="group rounded-xl border border-zinc-200 bg-white p-3 sm:p-3.5 transition hover:border-zinc-300"
>
  <div class="flex gap-3">
    <div class="flex-1 min-w-0">
      <p class="text-sm font-bold text-black leading-snug line-clamp-2">
        {{ item().product.name }}
      </p>
      <div class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-0.5 text-xs">
        <span class="font-bold text-primary-700 tabular-nums">
          {{ item().product.selling_price | formatPrice }}
        </span>
        @if (strategyService.isFieldVisible('unit')) {
          <span class="font-medium text-zinc-500">/ {{ item().product.unit || 'unité' }}</span>
        }
        <span class="font-medium text-zinc-500">· Stock {{ item().product.stock_quantity }}</span>
      </div>
    </div>

    <div class="flex flex-col items-end gap-1.5 shrink-0">
      <span class="text-sm sm:text-base font-extrabold text-black tabular-nums">
        {{ item().lineTotal | formatPrice }}
      </span>
      <button
        type="button"
        (click)="remove.emit()"
        title="Retirer"
        class="w-8 h-8 rounded-lg text-zinc-500 hover:bg-red-50 hover:text-red-600 transition flex items-center justify-center"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <div class="mt-3 flex items-center justify-between gap-2 pt-2.5 border-t border-zinc-100">
    <div class="inline-flex items-center rounded-xl border border-zinc-200 bg-zinc-50 p-0.5">
      <button
        type="button"
        (click)="quantityChange.emit(item().quantity - 1)"
        class="w-9 h-9 rounded-lg bg-white border border-zinc-200 text-black hover:bg-red-50 hover:text-red-600 hover:border-red-200 transition flex items-center justify-center"
        aria-label="Diminuer"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4" />
        </svg>
      </button>

      <input
        type="number"
        [value]="item().quantity"
        (change)="onQtyInputChange($event)"
        (blur)="onQtyInputChange($event)"
        (keydown.enter)="$any($event.target).blur()"
        class="w-14 sm:w-16 text-center text-sm font-extrabold text-black bg-white border border-zinc-200 rounded-lg mx-0.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 tabular-nums"
        [attr.step]="item().product.allow_fractional_quantity ? '0.001' : '1'"
        [attr.min]="item().product.allow_fractional_quantity ? '0.001' : '1'"
        [attr.max]="item().product.stock_quantity"
        inputmode="decimal"
        aria-label="Quantité"
      />

      <button
        type="button"
        (click)="quantityChange.emit(item().quantity + 1)"
        [disabled]="item().quantity >= item().product.stock_quantity"
        class="w-9 h-9 rounded-lg bg-white border border-zinc-200 text-black hover:bg-primary-50 hover:text-primary-700 hover:border-primary-200 transition flex items-center justify-center disabled:opacity-40 disabled:cursor-not-allowed"
        aria-label="Augmenter"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
        </svg>
      </button>
    </div>
  </div>
</div>
