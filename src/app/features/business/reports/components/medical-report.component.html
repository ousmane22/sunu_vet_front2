<div class="space-y-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <app-report-kpi-card
            accent="primary"
            icon="fas fa-stethoscope"
            [label]="strategyService.isVet() ? 'Consultations' : 'Activités'"
            [value]="'' + data.total_consultations"
            [hint]="strategyService.isVet() ? 'Actes enregistrés sur la période' : 'Opérations sur la période'"
            [badge]="data.partial_consultations_count ? data.partial_consultations_count + ' partielle(s)' : ''"
        />
        <app-report-kpi-card
            accent="emerald"
            icon="fas fa-hand-holding-medical"
            label="Encaissé soins"
            [value]="(data.total_consultations_collected ?? 0) | formatPrice"
            hint="Paiements reçus sur la période"
        />
        <app-report-kpi-card
            accent="slate"
            icon="fas fa-file-invoice-dollar"
            label="Facturé soins"
            [value]="data.total_consultations_net | formatPrice"
            hint="Montant net facturé sur la période"
        />
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
        <app-report-panel title="Par espèce animale" subtitle="Volume de consultations" icon="fas fa-paw">
            @if (data.by_species.length) {
            <div class="h-52 mb-5">
                <canvas baseChart [type]="'doughnut'" [data]="speciesChartData" [options]="speciesChartOptions"></canvas>
            </div>
            <div class="space-y-2">
                @for (sp of data.by_species; track sp.animal_species) {
                <div class="flex items-center justify-between gap-3 rounded-xl bg-slate-50 px-4 py-3 ring-1 ring-slate-100">
                    <span class="text-sm font-bold text-slate-700 capitalize">{{ sp.animal_species || 'Non renseigné' }}</span>
                    <div class="flex items-center gap-2 shrink-0">
                        @if (sp.total_net != null) {
                        <span class="text-xs font-semibold text-slate-500">{{ sp.total_net | formatPrice }}</span>
                        }
                        <span class="rounded-lg bg-white px-2.5 py-1 text-xs font-black text-primary-700 ring-1 ring-slate-200">{{ sp.count }}</span>
                    </div>
                </div>
                }
            </div>
            } @else {
            <app-report-empty-state [message]="'Aucune donnée ' + (strategyService.isVet() ? 'médicale' : 'd\'activité') + '.'" icon="fas fa-paw" />
            }
        </app-report-panel>

        <app-report-panel title="Tendance mensuelle" subtitle="6 derniers mois" icon="fas fa-chart-line">
            @if (data.monthly_volume.length) {
            <div class="h-72">
                <canvas baseChart [type]="'line'" [data]="monthlyChartData" [options]="monthlyChartOptions"></canvas>
            </div>
            } @else {
            <app-report-empty-state message="Aucune donnée historique disponible." icon="fas fa-chart-line" />
            }
        </app-report-panel>
    </div>
</div>
