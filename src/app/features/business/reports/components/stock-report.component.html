<div class="space-y-6">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <app-report-kpi-card
            accent="slate"
            icon="fas fa-warehouse"
            [label]="strategyService.isVet() ? 'Valorisation pharmacie' : 'Valorisation stock'"
            [value]="data.total_valuation | formatPrice"
            hint="Valeur totale au prix de vente"
        />
        <app-report-kpi-card accent="amber" icon="fas fa-triangle-exclamation" label="Stocks bas" [value]="'' + data.low_stock_count" hint="Articles à réapprovisionner" />
        <app-report-kpi-card accent="rose" icon="fas fa-hourglass-half" label="Péremption (30 j)" [value]="'' + data.expiring_soon_count" hint="Lots à surveiller" />
    </div>

    <app-report-panel
        [title]="strategyService.isVet() ? 'Top médicaments vendus' : 'Top produits vendus'"
        subtitle="Classement par volume sur la période"
        icon="fas fa-ranking-star">
        @if (data.top_sellers.length) {
        <div class="h-72 mb-5">
            <canvas baseChart [type]="'bar'" [data]="topSellersChartData" [options]="topSellersChartOptions"></canvas>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full min-w-[480px] text-left">
                <thead>
                    <tr class="border-b border-slate-100">
                        <th class="pb-3 pr-4 text-[10px] font-black uppercase tracking-wider text-slate-400">Rang</th>
                        <th class="pb-3 pr-4 text-[10px] font-black uppercase tracking-wider text-slate-400">{{ strategyService.isVet() ? 'Médicament' : 'Produit' }}</th>
                        <th class="pb-3 text-[10px] font-black uppercase tracking-wider text-slate-400 text-right">Unités</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-50">
                    @for (med of data.top_sellers; track med.name; let i = $index) {
                    <tr class="hover:bg-slate-50/80">
                        <td class="py-3 pr-4">
                            <span class="inline-flex w-8 h-8 items-center justify-center rounded-lg text-xs font-black"
                                [class.bg-amber-100]="i === 0"
                                [class.text-amber-800]="i === 0"
                                [class.bg-slate-100]="i !== 0"
                                [class.text-slate-600]="i !== 0">#{{ i + 1 }}</span>
                        </td>
                        <td class="py-3 pr-4 font-semibold text-slate-800">{{ med.name }}</td>
                        <td class="py-3 text-right font-black text-emerald-700">{{ med.total_sold | number:'1.0-0' }}</td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
        } @else {
        <app-report-empty-state message="Aucune vente enregistrée sur la période." icon="fas fa-pills" />
        }
    </app-report-panel>
</div>
