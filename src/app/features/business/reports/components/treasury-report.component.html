<div class="space-y-6">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <app-report-kpi-card accent="emerald" icon="fas fa-arrow-trend-up" label="Recettes" [value]="data.total_revenue | formatPrice" hint="Total encaissé sur la période" />
        <app-report-kpi-card accent="rose" icon="fas fa-arrow-trend-down" label="Dépenses" [value]="data.total_expenses | formatPrice" hint="Total décaissé sur la période" />
        <app-report-kpi-card
            [accent]="data.net_margin >= 0 ? 'primary' : 'rose'"
            icon="fas fa-scale-balanced"
            label="Marge nette"
            [value]="data.net_margin | formatPrice"
            [hint]="data.net_margin >= 0 ? 'Résultat positif sur la période' : 'Déficit sur la période'"
        />
    </div>

    <app-report-panel title="Structure des dépenses" subtitle="Par catégorie comptable" icon="fas fa-chart-pie">
        @if (data.expenses_by_category.length) {
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
            <div class="h-64">
                <canvas baseChart [type]="'doughnut'" [data]="expensesChartData" [options]="expensesChartOptions"></canvas>
            </div>
            <div class="space-y-4">
                @for (cat of data.expenses_by_category; track cat.category) {
                <div>
                    <div class="flex justify-between items-center mb-1.5 gap-2">
                        <span class="text-sm font-bold text-slate-700">{{ getCategoryLabel(cat.category) }}</span>
                        <span class="text-sm font-black text-slate-900 shrink-0">{{ cat.total | formatPrice }}</span>
                    </div>
                    <div class="h-2 rounded-full bg-slate-100 overflow-hidden">
                        <div class="h-full rounded-full bg-rose-500/80" [style.width.%]="expenseShare(cat.total)"></div>
                    </div>
                    <p class="text-[10px] font-bold text-slate-400 mt-1 text-right">{{ expenseShare(cat.total) }}%</p>
                </div>
                }
            </div>
        </div>
        } @else {
        <app-report-empty-state message="Aucune dépense sur cette période." icon="fas fa-receipt" />
        }
    </app-report-panel>
</div>
