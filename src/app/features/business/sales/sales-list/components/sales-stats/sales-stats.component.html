<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <!-- Aujourd'hui -->
    <button type="button" (click)="select('today')"
        [class.border-green-600]="selectedPeriod() === 'today'"
        [class.bg-green-50]="selectedPeriod() === 'today'"
        [class.border-gray-300]="selectedPeriod() !== 'today'"
        class="text-left bg-white p-5 rounded-xl border-2 transition-colors cursor-pointer hover:border-green-500">
        <p class="text-xs font-bold text-black uppercase tracking-wide mb-2 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-green-600"></span>
            Ventes Aujourd'hui
        </p>
        <h3 class="text-2xl font-bold text-green-800">{{ statsToday().amount | formatPrice }}</h3>
        <p class="text-sm font-semibold text-green-700 mt-2">
            {{ statsToday().count }} produits vendus
        </p>
    </button>

    <!-- Semaine -->
    <button type="button" (click)="select('week')"
        [class.border-blue-600]="selectedPeriod() === 'week'"
        [class.bg-blue-50]="selectedPeriod() === 'week'"
        [class.border-gray-300]="selectedPeriod() !== 'week'"
        class="text-left bg-white p-5 rounded-xl border-2 transition-colors cursor-pointer hover:border-blue-500">
        <p class="text-xs font-bold text-black uppercase tracking-wide mb-2 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-blue-600"></span>
            Ventes Cette Semaine
        </p>
        <h3 class="text-2xl font-bold text-blue-800">{{ statsWeek().amount | formatPrice }}</h3>
        <p class="text-sm font-medium text-gray-700 mt-2">
            Chiffre d'affaires hebdomadaire
        </p>
    </button>

    <!-- Mois -->
    <button type="button" (click)="select('month')"
        [class.border-teal-600]="selectedPeriod() === 'month'"
        [class.bg-teal-50]="selectedPeriod() === 'month'"
        [class.border-gray-300]="selectedPeriod() !== 'month'"
        class="text-left bg-white p-5 rounded-xl border-2 transition-colors cursor-pointer hover:border-teal-500">
        <p class="text-xs font-bold text-black uppercase tracking-wide mb-2 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-teal-600"></span>
            Ventes Ce Mois
        </p>
        <h3 class="text-2xl font-bold text-teal-800">{{ statsMonth().amount | formatPrice }}</h3>
        <p class="text-sm font-medium text-gray-700 mt-2">
            Chiffre d'affaires mensuel
        </p>
    </button>
</div>
