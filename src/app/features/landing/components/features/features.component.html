<section id="features" class="scroll-mt-20 py-12 sm:py-16 md:py-20 bg-white">
  <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-10 sm:mb-14 md:mb-16">
      <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold text-gray-800 mb-3 sm:mb-4 px-1">
        Toutes les fonctionnalités dont vous avez besoin
      </h2>
      <p class="text-base sm:text-lg md:text-xl text-gray-600 max-w-2xl mx-auto px-1">
        Une solution complète pour gérer efficacement votre clinique vétérinaire au quotidien
      </p>
    </div>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
      @for (feature of features; track feature.title) {
        <div class="group p-6 sm:p-8 bg-gray-50 rounded-2xl hover:shadow-xl transition-all hover:-translate-y-1 min-w-0">
          <div class="w-16 h-16 rounded-2xl {{feature.color}} flex items-center justify-center text-3xl mb-6 group-hover:scale-110 transition-transform">
            <i class="{{feature.icon}}"></i>
          </div>
          <h3 class="text-xl font-bold text-gray-800 mb-3">{{feature.title}}</h3>
          <p class="text-gray-600">{{feature.description}}</p>
        </div>
      }
    </div>
  </div>
</section>
