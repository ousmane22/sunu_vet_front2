<header
  class="sticky top-0 z-50 transition-all duration-300 border-b"
  [class.bg-white/95]="scrolled() || menuOpen()"
  [class.backdrop-blur-md]="scrolled() || menuOpen()"
  [class.shadow-sm]="scrolled()"
  [class.border-gray-200/80]="scrolled() || menuOpen()"
  [class.border-transparent]="!scrolled() && !menuOpen()"
  [class.bg-transparent]="!scrolled() && !menuOpen()"
>
  <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between gap-4 h-16 lg:h-[4.5rem]">
      <a
        routerLink="/"
        class="inline-flex shrink-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 rounded-lg"
        aria-label="SunuVet — accueil"
        (click)="closeMenu()"
      >
        <img src="assets/images/logo_vet.png" alt="SunuVet" width="140" height="70" class="h-12 lg:h-14 w-auto object-contain" />
      </a>

      <nav class="hidden lg:flex items-center gap-8 text-sm font-semibold text-gray-700" aria-label="Navigation principale">
        <a href="#features" (click)="scrollToSection('features', $event)" class="no-underline hover:text-primary-600 transition-colors">Fonctionnalités</a>
        <a href="#assistant-ia" (click)="scrollToSection('assistant-ia', $event)" class="no-underline hover:text-primary-600 transition-colors">SunuVet Assistant</a>
        <a href="#tarifs" (click)="scrollToSection('tarifs', $event)" class="no-underline hover:text-primary-600 transition-colors">Tarifs</a>
        <button type="button" (click)="actions.openDemo()" class="hover:text-primary-600 transition-colors bg-transparent border-none cursor-pointer font-inherit p-0">
          Démo
        </button>
      </nav>

      <div class="hidden lg:flex items-center gap-3 shrink-0">
        <button
          type="button"
          (click)="actions.goToMyAccount()"
          class="px-4 py-2 text-sm font-bold text-primary-700 hover:bg-primary-50 rounded-xl transition-colors border border-primary-100"
        >
          Mon compte
        </button>
        <button
          type="button"
          (click)="actions.goToRegister()"
          class="px-5 py-2.5 text-sm font-bold text-white bg-primary-600 hover:bg-primary-500 rounded-xl shadow-md shadow-primary-600/20 transition-colors"
        >
          Essai gratuit
        </button>
      </div>

      <button
        type="button"
        class="lg:hidden p-2 rounded-xl text-gray-700 hover:bg-gray-100"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Menu"
      >
        @if (menuOpen()) {
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        } @else {
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        }
      </button>
    </div>

    @if (menuOpen()) {
    <nav class="lg:hidden pb-4 border-t border-gray-100 pt-3 space-y-1" aria-label="Navigation mobile">
      <a href="#features" (click)="scrollToSection('features', $event)" class="block px-3 py-2.5 rounded-xl text-gray-800 font-semibold hover:bg-gray-50 no-underline">Fonctionnalités</a>
      <a href="#assistant-ia" (click)="scrollToSection('assistant-ia', $event)" class="block px-3 py-2.5 rounded-xl text-gray-800 font-semibold hover:bg-gray-50 no-underline">SunuVet Assistant</a>
      <a href="#tarifs" (click)="scrollToSection('tarifs', $event)" class="block px-3 py-2.5 rounded-xl text-gray-800 font-semibold hover:bg-gray-50 no-underline">Tarifs</a>
      <button type="button" (click)="actions.openDemo(); closeMenu()" class="block w-full text-left px-3 py-2.5 rounded-xl text-gray-800 font-semibold hover:bg-gray-50 bg-transparent border-none cursor-pointer">
        Démo
      </button>
      <div class="flex flex-col gap-2 pt-3 px-1">
        <button type="button" (click)="actions.goToMyAccount(); closeMenu()" class="w-full py-3 font-bold text-primary-700 border border-primary-100 rounded-xl hover:bg-primary-50">
          Mon compte
        </button>
        <button type="button" (click)="actions.goToRegister(); closeMenu()" class="w-full py-3 font-bold text-white bg-primary-600 rounded-xl hover:bg-primary-500">
          Essai gratuit 15 jours
        </button>
      </div>
    </nav>
    }
  </div>
</header>
