<section class="py-12 sm:py-16 md:py-20 bg-white">
  <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-10 sm:mb-14 md:mb-16">
      <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold text-gray-800 mb-3 sm:mb-4 px-1">
        Ils nous font confiance
      </h2>
      <p class="text-base sm:text-lg md:text-xl text-gray-600 max-w-2xl mx-auto px-1">
        Découvrez ce que nos clients disent de SunuVet
      </p>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 sm:gap-8">
      @for (testimonial of testimonials; track testimonial.name) {
        <div class="bg-gray-50 rounded-2xl p-6 sm:p-8 hover:shadow-xl transition-all min-w-0">
          <div class="flex items-center gap-1 mb-4">
            @for (star of [1,2,3,4,5]; track star) {
              <svg class="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
              </svg>
            }
          </div>
          
          <p class="text-gray-700 mb-6 italic text-sm sm:text-base break-words hyphens-auto">"{{testimonial.comment}}"</p>
          
          <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-gradient-to-br from-primary-400 to-primary-600 rounded-full flex items-center justify-center text-2xl text-white">
              <i class="{{testimonial.avatar}}"></i>
            </div>
            <div>
              <p class="font-bold text-gray-800">{{testimonial.name}}</p>
              <p class="text-sm text-gray-600">{{testimonial.role}}</p>
              <p class="text-sm text-primary-600">{{testimonial.business}}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
