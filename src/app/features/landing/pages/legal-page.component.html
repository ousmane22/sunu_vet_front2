<div class="min-h-screen bg-gray-50">
  <header class="bg-white border-b border-gray-200">
    <div class="mx-auto max-w-3xl px-4 sm:px-6 py-6 flex items-center justify-between gap-4">
      <a routerLink="/" class="inline-flex items-center gap-2 text-primary-700 font-bold hover:text-primary-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Retour à l’accueil
      </a>
      <img src="assets/images/logo_vet.png" alt="SunuVet" class="h-10 w-auto" />
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-4 sm:px-6 py-10 sm:py-14">
    <h1 class="font-serif text-3xl sm:text-4xl font-bold text-gray-900 mb-3">{{ content.title }}</h1>
    <p class="text-lg text-gray-600 mb-10">{{ content.intro }}</p>

    <div class="space-y-8">
      @for (section of content.sections; track section.title) {
      <section class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 sm:p-8">
        <h2 class="font-serif text-xl font-bold text-gray-900 mb-3">{{ section.title }}</h2>
        @for (p of section.paragraphs; track p) {
        <p class="text-gray-600 leading-relaxed mb-3 last:mb-0">{{ p }}</p>
        }
      </section>
      }
    </div>

    <p class="mt-10 text-center text-sm text-gray-500">
      <a routerLink="/register" class="text-primary-600 font-semibold hover:underline">Créer un compte essai gratuit</a>
    </p>
  </main>
</div>
