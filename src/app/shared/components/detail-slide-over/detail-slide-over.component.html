@if (open()) {
<div class="fixed inset-0 z-[120] flex justify-end overflow-hidden" role="dialog" aria-modal="true"
  [attr.aria-label]="title() || 'Panneau de détail'">
  <!-- Overlay -->
  <div (click)="emitClose()" class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" aria-hidden="true"></div>

  <!-- Panel -->
  <div
    [class]="'relative w-full ' + panelClass() + ' bg-white shadow-2xl border-l-2 border-gray-300 flex flex-col h-full rounded-l-2xl animate-in slide-in-from-right duration-200'">

    @if (loading()) {
    <div class="flex-1 flex flex-col items-center justify-center gap-4 px-6">
      <div class="relative h-10 w-10">
        <div class="absolute inset-0 rounded-full border-2 border-gray-200"></div>
        <div class="absolute inset-0 rounded-full border-2 border-primary-600 border-t-transparent animate-spin"></div>
      </div>
      <p class="text-sm font-semibold text-black">Chargement…</p>
    </div>
    } @else {
    <!-- Header -->
    <div class="px-6 py-4 border-b-2 border-gray-300 flex items-start justify-between gap-3 shrink-0 bg-white">
      <div class="min-w-0 flex-1">
        @if (title()) {
        <h2 class="text-xl font-bold text-black truncate">{{ title() }}</h2>
        }
        @if (subtitle()) {
        <p class="text-sm font-medium text-gray-700 mt-0.5 truncate">{{ subtitle() }}</p>
        }
        <ng-content select="[slideHeader]" />
      </div>
      <button type="button" (click)="emitClose()"
        class="p-2 rounded-xl border-2 border-gray-300 text-black hover:bg-gray-50 transition-colors shrink-0"
        aria-label="Fermer">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="flex-1 overflow-y-auto min-h-0">
      <ng-content />
    </div>

    <!-- Footer optionnel -->
    <ng-content select="[slideFooter]" />
    }
  </div>
</div>
}
