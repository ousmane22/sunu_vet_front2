@if (open()) {
<div
  class="fixed inset-0 z-[120] flex items-center justify-center p-4 pt-[max(1rem,env(safe-area-inset-top))] pb-[max(1rem,env(safe-area-inset-bottom))] bg-black/50 backdrop-blur-sm"
  role="dialog"
  aria-modal="true"
  aria-labelledby="open-register-title"
>
  <div class="w-full max-w-md rounded-2xl bg-white shadow-2xl border border-gray-100 overflow-hidden" (click)="$event.stopPropagation()">
    <div class="flex items-start gap-4 p-5 sm:p-6">
      <div class="shrink-0 w-11 h-11 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 17c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
      <div class="min-w-0 flex-1">
        <h2 id="open-register-title" class="text-lg font-bold text-gray-900 leading-snug">Aucune caisse ouverte</h2>
        <p class="mt-2 text-sm text-gray-600 leading-relaxed">
          Le cabinet exige une session caisse ouverte avant d'enregistrer {{ activityLabel() }}.
          Demandez à un collègue d'ouvrir la caisse du jour, ou ouvrez-la vous-même.
        </p>
      </div>
    </div>

    <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 px-5 sm:px-6 pb-5 sm:pb-6 bg-gray-50/80 border-t border-gray-100">
      <button
        type="button"
        (click)="openRegister.emit()"
        class="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-primary-600 hover:bg-primary-500 text-sm font-bold text-white transition-colors shadow-sm"
      >
        Ouvrir la caisse
      </button>
    </div>
  </div>
</div>
}
